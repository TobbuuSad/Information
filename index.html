<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TobbuuSad</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --glass: linear-gradient(160deg, rgba(255, 105, 180, .20), rgba(35, 4, 22, .60));
    --line: rgba(255, 150, 200, .38);
    --pink: #ff8ac2;
    --pink-strong: #ff4f9f;
    --pink-soft: rgba(255, 110, 175, .14);
  }

  html, body { min-height: 100%; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 0;
    background: #05060a;
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
    overflow-x: hidden;
  }

  /* Живые обои (видео) + запасной анимированный фон */
  .video-bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    z-index: -2;
  }
  .bg {
    position: fixed;
    inset: 0;
    z-index: -3;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 20%, #3b0a24 0%, transparent 55%),
      radial-gradient(circle at 80% 75%, #2a0a3d 0%, transparent 55%),
      #05060a;
  }
  .bg span {
    position: absolute;
    width: 60vmax;
    height: 60vmax;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .45;
    animation: float 18s ease-in-out infinite alternate;
  }
  .bg span:nth-child(1) { background: #be185d; top: -20%; left: -15%; }
  .bg span:nth-child(2) { background: #7e22ce; bottom: -30%; right: -15%; animation-delay: -6s; }
  .bg span:nth-child(3) { background: #9d174d; top: 30%; left: 45%; animation-delay: -12s; }
  @keyframes float {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(6vw, -4vh, 0) scale(1.15); }
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 50% 45%, rgba(255, 60, 140, .10), transparent 65%),
      rgba(0, 0, 0, .38);
    z-index: -1;
  }

  .card {
    width: min(420px, 92vw);
    padding: 40px 30px;
    text-align: center;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 20px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(255, 20, 120, .22), inset 0 1px 0 rgba(255, 255, 255, .08);
  }

  .avatar {
    display: block;
    width: 170px;
    height: 170px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255, 170, 210, .7);
    margin: 0 auto 16px;
    background: #2a0a1c;
    box-shadow: 0 0 34px rgba(255, 70, 150, .55);
  }

  h1 {
    font-size: 24px;
    margin-bottom: 6px;
    text-shadow: 0 0 22px rgba(255, 80, 160, .45);
  }

  .views { font-size: 13px; opacity: .7; margin-bottom: 14px; }

  .bio {
    font-size: 14px;
    opacity: .85;
    margin-bottom: 26px;
    min-height: 20px;
  }
  .bio::after {
    content: '|';
    animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .links {
    display: flex;
    justify-content: center;
    gap: 14px;
  }
  .links a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 160, 205, .45);
    background: rgba(255, 120, 180, .12);
    transition: .25s;
  }
  .links a svg {
    width: 20px;
    height: 20px;
    fill: #fff;
  }
  .links a img {
    width: 22px;
    height: 22px;
    object-fit: contain;
  }
  .links a:hover {
    border-color: #ff9ccb;
    background: rgba(255, 100, 170, .28);
    box-shadow: 0 0 18px rgba(255, 80, 160, .45);
    transform: scale(1.1);
  }

  .music {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
  }
  .music button {
    background: none;
    border: none;
    color: #ffb3d6;
    font-size: 22px;
    cursor: pointer;
    width: 32px;
    height: 32px;
    line-height: 1;
  }
  .marquee { overflow: hidden; white-space: nowrap; width: 170px; color: #ffc9e0; }
  .marquee span {
    display: inline-block;
    padding-left: 100%;
    animation: scroll 9s linear infinite;
  }
  @keyframes scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-100%); }
  }
  #sc-player {
    position: fixed;
    left: -9999px;
    top: -9999px;
    width: 320px;
    height: 180px;
    border: 0;
    pointer-events: none;
  }

  .side-card {
    position: fixed;
    left: 4vw;
    width: min(260px, 92vw);
    padding: 24px;
  }
  .side-card h2 {
    font-size: 18px;
    margin-bottom: 14px;
    letter-spacing: 1px;
    color: #ffc9e0;
  }
  .card-friends {
    top: 50%;
    transform: translateY(-50%);
  }

  .friends-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .friend {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255, 160, 205, .28);
    background: rgba(255, 120, 180, .10);
    text-decoration: none;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    transition: .25s;
  }
  .friend:hover {
    background: rgba(255, 100, 170, .24);
    border-color: #ff9ccb;
    box-shadow: 0 0 18px rgba(255, 80, 160, .28);
    transform: translateX(4px);
  }
  .friend img {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid rgba(255, 170, 210, .55);
  }

  @media (max-width: 860px) {
    body {
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      height: auto;
      min-height: 100vh;
      padding: 20px 0;
    }
    .side-card {
      position: static;
      transform: none;
      left: auto;
      right: auto;
      top: auto;
      width: min(420px, 92vw);
    }
    .card         { order: 1; }
    .card-friends { order: 2; }
  }
</style>

<iframe id="sc-player" aria-hidden="true" tabindex="-1" allow="autoplay; encrypted-media"
  src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fapi.soundcloud.com%2Ftracks%2F1630790463&color=%23a78bfa&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false"></iframe>

<script>
  const COUNTER_KEY = 'tobbuusad-bio-site-views-v1';
  fetch('https://countapi.mileshilliard.com/api/v1/hit/' + COUNTER_KEY)
    .then(r => r.json())
    .then(d => { document.getElementById('views').textContent = d.value; })
    .catch(() => { document.getElementById('views').textContent = '—'; });

  const phrases = ['ЫЫЫЫ Майнкрафт хуйня', 'Я тупоооой...', 'Осу - для долбаёбов', 'Я как Александр Пистолетов'];
  let p = 0, i = 0, del = false;
  (function type() {
    const el = document.getElementById('bio');
    const cur = phrases[p];
    el.textContent = cur.slice(0, i);
    if (!del && i < cur.length) i++;
    else if (del && i > 0) i--;
    else if (i === cur.length) { del = true; setTimeout(type, 1500); return; }
    else { del = false; p = (p + 1) % phrases.length; }
    setTimeout(type, del ? 40 : 90);
  })();

  /* Песня через SoundCloud (скрытый плеер, полный трек) */
  const SC_TRACK_URL = 'https://soundcloud.com/proektbezimeni/buster-x-lixxx-x-frame-tamer-x-rostik-ya-tupoy-bebra-2';
  const scFrame = document.getElementById('sc-player');
  const playBtn = document.getElementById('playBtn');
  let scWidget = null, scReady = false, isPlaying = false, wantPlay = false, scFailed = false;

  function scFail() {
    scFailed = true;
    isPlaying = false;
    playBtn.textContent = '▶';
    playBtn.title = 'Открыть песню на SoundCloud';
  }

  function initSoundCloud() {
    if (scWidget || !window.SC || !SC.Widget) return;
    scWidget = SC.Widget(scFrame);

    scWidget.bind(SC.Widget.Events.READY, function () {
      scReady = true;
      scWidget.setVolume(25);
      if (wantPlay) scWidget.play();
    });

    scWidget.bind(SC.Widget.Events.PLAY, function () {
      isPlaying = true;
      playBtn.textContent = '🎵';
      playBtn.title = 'Пауза';
    });

    scWidget.bind(SC.Widget.Events.PAUSE, function () {
      isPlaying = false;
      playBtn.textContent = '❌';
      playBtn.title = 'Продолжить';
    });

    scWidget.bind(SC.Widget.Events.FINISH, function () {
      if (!scFailed) {
        scWidget.seekTo(0);
        scWidget.play();
      }
    });
  }

  const scScript = document.createElement('script');
  scScript.src = 'https://w.soundcloud.com/player/api.js';
  scScript.onload = initSoundCloud;
  scScript.onerror = scFail;
  document.head.appendChild(scScript);

  setTimeout(function () {
    if (!scReady && !scFailed) scFail();
  }, 12000);

  function requestPlay() {
    if (scFailed) return;
    wantPlay = true;
    if (scReady && scWidget) scWidget.play();
  }

  /* Первый клик по странице запускает музыку (как в оригинале) */
  document.addEventListener('click', requestPlay, { once: true });

  playBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (scFailed) { window.open(SC_TRACK_URL, '_blank', 'noopener'); return; }
    if (!scReady) { wantPlay = true; return; }
    if (isPlaying) scWidget.pause();
    else requestPlay();
  });
</script>
